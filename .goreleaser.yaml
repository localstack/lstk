version: 2

project_name: lstk

before:
  hooks:
    - go mod tidy
    - mkdir -p completions
    - sh -c "go run . completion bash > completions/lstk.bash"
    - sh -c "go run . completion zsh > completions/lstk.zsh"
    - sh -c "go run . completion fish > completions/lstk.fish"
    - mkdir -p manpages
    - sh -c "go run . docs --format man --dir ./manpages"

builds:
  - id: lstk
    main: ./main.go
    binary: lstk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # bundlesExtensions must match whether the archives below ship the bundle;
      # scripts/bundled-extensions/check-bundled-packaging-sync.sh enforces it.
      - -s -w -X github.com/localstack/lstk/internal/version.version={{ .Version }} -X github.com/localstack/lstk/internal/version.bundlesExtensions=true

archives:
  - id: lstk
    ids:
      - lstk
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - completions/*
      - manpages/*
      # LocalStack's bundled extensions: one multi-call binary per platform plus
      # the descriptions file, at the archive root next to lstk. Staged under
      # bundled/ by scripts/bundled-extensions/fetch-bundled-extensions.sh,
      # which the release job runs first; a local snapshot build needs it too
      # (see docs/extensions-bundling.md). A glob matching nothing fails the
      # build.
      #
      # The glob is the binary alone (bare on Unix, .exe on Windows). Nothing
      # else in the staged platform directory is shipped: lstk finds bundled
      # commands through lstk-extensions.toml and dispatches by argv[0], so a
      # per-command file at the archive root would serve no purpose.
      - src: "bundled/{{ .Os }}_{{ .Arch }}/bundled-extensions*"
        strip_parent: true
        info:
          mode: 0o755
      - src: bundled/lstk-extensions.toml
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

homebrew_casks:
  - name: lstk
    directory: Casks
    repository:
      owner: localstack
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/localstack/lstk
    description: "LocalStack CLI v2 - Start and manage LocalStack emulators"
    license: Apache-2.0
    completions:
      bash: completions/lstk.bash
      zsh: completions/lstk.zsh
      fish: completions/lstk.fish
    # hooks.post.install emits Homebrew's deprecated `postflight`; the
    # replacement arrives as hooks.post.install_steps in GoReleaser v2.19
    # (goreleaser/goreleaser#6873). Until then custom_block writes the stanza,
    # escaping `{{staged_path}}` past GoReleaser's template pass. It renders
    # first in the cask, so `brew style` reports stanza-order offences.
    custom_block: |
      postflight_steps do
        on_macos do
          # The whole staged dir, not only lstk: the bundled extensions binary
          # sits next to it and would otherwise be blocked by Gatekeeper on its
          # first run.
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}"]
        end
      end
