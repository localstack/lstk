name: Linear Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  linear-release:
    name: Create Linear release
    # Same tag trigger as ci.yml's release job: never run for a fork's own tags.
    if: github.repository == 'localstack/lstk'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create Linear release
        uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0.18.0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
