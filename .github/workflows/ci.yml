name: LSTK CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  checks: write

# Cancel superseded runs on the same PR. Non-PR runs (push/tag/release) each
# get a unique group via run_id, so cancel-in-progress can never touch them —
# the reusable workflow_call from the release pipeline is never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .tool-versions

  # Reachability-based vulnerability scan, complementing trivy.yml's
  # dependency scan. Runs against both Go modules (no go.work ties them
  # together).
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # SARIF report for the Security tab; never fails the job (gate steps
      # below own pass/fail). repo-checkout: false everywhere: the action's
      # default checkout (with git clean) would delete a prior step's *.sarif
      # file before the upload step can read it.
      - name: Run govulncheck (root module, SARIF report)
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-file: go.mod
          output-format: sarif
          output-file: govulncheck-root.sarif

      - name: Run govulncheck (test/integration module, SARIF report)
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          work-dir: test/integration
          go-version-file: test/integration/go.mod
          output-format: sarif
          output-file: govulncheck-integration.sarif

      # Fork-PR tokens have no security-events:write, so skip the upload there
      # (the scan + gate still run).
      - name: Upload SARIF (root module)
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: govulncheck-root.sarif
          category: govulncheck-root

      - name: Upload SARIF (test/integration module)
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: govulncheck-integration.sarif
          category: govulncheck-integration

      # The blocking gate: fails on any known vulnerability reachable from the
      # repo's own code.
      - name: Run govulncheck (root module, gate)
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-file: go.mod

      - name: Run govulncheck (test/integration module, gate)
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          work-dir: test/integration
          go-version-file: test/integration/go.mod

  goreleaser-check:
    name: GoReleaser Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run GoReleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      # `goreleaser check` only validates config syntax, so it cannot see that
      # packaging bundled extensions and downloading them have to land
      # together. This does, and fails the PR instead of the release.
      - name: Check bundled packaging is in step with the download
        run: scripts/bundled-extensions/check-bundled-packaging-sync.sh

      - name: Test release scripts
        run: make test-scripts

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run unit tests
        run: make test
        env:
          CREATE_JUNIT_REPORT: "true"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: test-results.xml

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Unit Test Results
          path: test-results.xml
          reporter: java-junit

  test-integration:
    name: Integration Tests (${{ matrix.os }}${{ matrix.shard && format(' shard {0}/{1}', matrix.shard, matrix.shard_total) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: 1
            shard_total: 4
          - os: ubuntu-latest
            shard: 2
            shard_total: 4
          - os: ubuntu-latest
            shard: 3
            shard_total: 4
          - os: ubuntu-latest
            shard: 4
            shard_total: 4
          - os: macos-latest
          - os: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            test/integration/go.sum

      # Install lstk via Homebrew so the Homebrew update integration test
      # (TestUpdateHomebrew) can locate a real Caskroom binary path.
      - name: Install lstk via Homebrew
        if: matrix.os == 'macos-latest'
        run: brew install localstack/tap/lstk

      # Install Terraform and OpenTofu so the `lstk terraform` end-to-end tests
      # (terraform_e2e_test.go) run on the Docker-capable Linux shards. They
      # skip automatically wherever the binaries are absent (macOS/Windows).
      - name: Install Terraform
        if: matrix.os == 'ubuntu-latest'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install OpenTofu
        if: matrix.os == 'ubuntu-latest'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      # Install the AWS CDK CLI so the `lstk cdk` end-to-end tests
      # (cdk_e2e_test.go) run on the Docker-capable Linux shards. They skip
      # automatically wherever cdk is absent (macOS/Windows). lstk requires
      # CDK >= 2.177.0; the latest release satisfies that.
      - name: Install AWS CDK
        if: matrix.os == 'ubuntu-latest'
        run: npm install -g aws-cdk

      # Install the AWS SAM CLI so the `lstk sam` end-to-end tests
      # (sam_e2e_test.go) run on the Docker-capable Linux shards. They skip
      # automatically wherever sam is absent (macOS/Windows). The ubuntu-latest
      # image currently ships sam, but we install it explicitly so the tests
      # don't silently lose coverage if a future image drops it. lstk requires
      # SAM >= 1.95.0; the latest release satisfies that.
      - name: Install AWS SAM CLI
        if: matrix.os == 'ubuntu-latest'
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Run integration tests
        run: make test-integration
        env:
          CREATE_JUNIT_REPORT: "true"
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          LSTK_TEST_HOMEBREW: ${{ matrix.os == 'macos-latest' && '1' || '0' }}
          LSTK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ matrix.shard_total }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results-${{ matrix.os }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: test-integration-results.xml

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Integration Test Results (${{ matrix.os }}${{ matrix.shard && format(' shard {0}/{1}', matrix.shard, matrix.shard_total) || '' }})
          path: test-integration-results.xml
          reporter: java-junit

  # Aggregator job under a stable name so branch ruleset can require a single
  # status check regardless of how many shards the integration matrix uses.
  test-integration-summary:
    name: Integration Tests (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: test-integration
    if: always()
    timeout-minutes: 5
    steps:
      - name: Verify integration matrix succeeded
        run: |
          if [ "${{ needs.test-integration.result }}" != "success" ]; then
            echo "test-integration matrix result: ${{ needs.test-integration.result }}"
            exit 1
          fi

  test-launcher:
    name: Launcher Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run launcher tests
        run: node --test npm/*.test.js

  release:
    name: Build and Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - lint
      - goreleaser-check
      - test-unit
      - test-integration
      - test-launcher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate version tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match version format v0.minor.patch"
            exit 1
          fi

      # Bundled extensions. Downloads the multi-call binary for every platform
      # and the descriptions file from the private extensions repo, verifies
      # them against its checksum manifest, and stages them under bundled/ for
      # GoReleaser and the npm step below. The version file says `latest`, so
      # the script resolves that to one concrete tag here, and every later step
      # uses that tag. On a re-run of an already-published lstk release the tag
      # is read back from that release's notes instead of re-resolved, so the
      # re-run ships the same extension binaries the original did.
      - name: Fetch bundled extensions
        id: bundle
        run: |
          recorded="$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body 2>/dev/null \
            | sed -n 's/^Bundled extensions: \([^ ]*\).*/\1/p' | head -n1 || true)"
          if [ -n "${recorded}" ]; then
            echo "Release ${GITHUB_REF_NAME} already records bundle ${recorded}; pinning to it."
            export LSTK_EXTENSIONS_TAG="${recorded}"
          fi
          scripts/bundled-extensions/fetch-bundled-extensions.sh | tee fetch.log
          tag="$(sed -n 's/^Resolved extensions bundle: \([^ ]*\) .*/\1/p' fetch.log)"
          [ -n "${tag}" ] || { echo "could not determine the resolved bundle tag"; exit 1; }
          commit="$(GH_TOKEN="${LSTK_EXTENSIONS_READ_TOKEN}" gh api "repos/${LSTK_EXTENSIONS_REPO}/commits/${tag}" --jq .sha)"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LSTK_EXTENSIONS_READ_TOKEN: ${{ secrets.LSTK_EXTENSIONS_READ_TOKEN }}
          LSTK_EXTENSIONS_REPO: localstack/lstk-bundled-extensions

      # A command described in lstk-extensions.toml that the bundle does not
      # provide would show in help and fail when run; a binary whose commands
      # are all undescribed would be unreachable. Either fails the release. The
      # bundle's side of the comparison comes from asking it — the gate runs
      # `bundled-extensions list` — so it has to be pointed at the runner's own
      # platform directory.
      - name: Check descriptions match the bundled binary
        run: scripts/bundled-extensions/check-descriptions.sh bundled/linux_amd64

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.PRO_ACCESS_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Build the platform packages and main wrapper package from the
      # GoReleaser output. This is the same tool the previous
      # evg4b/goreleaser-npm-publisher-action wrapped, split into an explicit
      # build step so we can swap in our own launcher before publishing.
      - name: Build npm packages
        run: >
          npx --yes goreleaser-npm-publisher@1.5.0 build
          --project .
          --prefix @localstack
          --license Apache-2.0
          --description "LocalStack CLI v2 - Start and manage LocalStack emulators"
          --files README.md LICENSE
          --keywords cli developer-tools local-development localstack

      # Replace the auto-generated wrapper with our launcher, which forwards
      # SIGINT/SIGTERM/SIGHUP to the Go binary (DEVX-942). The generated wrapper
      # spawns the binary without signal handlers, so a programmatic kill of the
      # Node process would orphan the child, including mid-flight container starts.
      - name: Install signal-forwarding launcher
        run: cp npm/launcher.js dist/npm/lstk/index.js

      # The launcher execs the Go binary from the platform package, so that is
      # where lstk's bundled dir resolves to and where the bundled extensions
      # must live — not the wrapper. The script also registers them in each
      # package's `files` allowlist: the publisher emits "files": [], which npm
      # packs as package.json + bin only, so a bare copy would be dropped.
      - name: Add bundled extensions to the npm platform packages
        run: scripts/bundled-extensions/add-bundled-to-npm.sh dist/npm bundled

      - name: Publish to NPM
        run: |
          for dir in dist/npm/lstk-*/ dist/npm/lstk/; do
            npm publish "$dir" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      # Permanent record of which bundle this release shipped. Job logs expire;
      # the release notes do not, and they are what someone investigating a
      # bundled-extension bug months later will read. Idempotent so a re-run
      # does not append a second line.
      - name: Record the bundle in the release notes
        run: |
          gh release view "${GITHUB_REF_NAME}" --json body --jq .body > notes.md
          if grep -q '^Bundled extensions: ' notes.md; then
            echo "Release notes already record the bundle."
            exit 0
          fi
          printf '\n\n---\n\nBundled extensions: %s (commit %s)\n' "${TAG}" "${COMMIT}" >> notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bundle.outputs.tag }}
          COMMIT: ${{ steps.bundle.outputs.commit }}
