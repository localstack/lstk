name: Sync Labels

on:
  schedule:
    # once a day at midnight
    - cron: "0 0 * * *"
  workflow_dispatch:

# The called workflow uses the github-token secret, never GITHUB_TOKEN.
permissions: {}

jobs:
  sync-labels:
    uses: localstack/meta/.github/workflows/sync-labels.yml@83b4ff2ee4169d58eeb35bfa6dcddf9f35388212 # main @ 2026-04-22
    with:
      categories: docs
    secrets:
      github-token: ${{ secrets.PRO_ACCESS_TOKEN }}