name: Weekly Go Toolchain Upgrade

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade-go:
    name: Upgrade Go Toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      - name: Upgrade Go toolchain
        run: |
          go get toolchain@latest
          go mod tidy
          cd test/integration
          go get toolchain@latest
          go mod tidy

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/weekly-go-upgrade
          author: "LocalStack Bot <localstack-bot@users.noreply.github.com>"
          committer: "LocalStack Bot <localstack-bot@users.noreply.github.com>"
          commit-message: "chore(go): weekly Go toolchain upgrade"
          title: "chore(go): weekly Go toolchain upgrade"
          body: |
            Automated weekly Go toolchain upgrade.

            - Updates the `toolchain` directive to the latest released Go version.
            - Runs `go mod tidy` to keep module files consistent.
          labels: |
            dependencies
            semver: patch
            docs: skip
          token: ${{ secrets.PRO_ACCESS_TOKEN }}
