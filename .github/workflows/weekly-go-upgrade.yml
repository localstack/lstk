name: Weekly Go Toolchain Upgrade

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

# create-pull-request pushes and opens the PR with GH_TOKEN_OPEN_NEW_PR.
permissions: {}

jobs:
  upgrade-go:
    name: Upgrade Go Toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true

      - name: Upgrade Go toolchain
        run: |
          go get toolchain@latest
          go mod tidy
          cd test/integration
          go get toolchain@latest
          go mod tidy

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: chore/weekly-go-upgrade
          author: "LocalStack Bot <localstack-bot@users.noreply.github.com>"
          committer: "LocalStack Bot <localstack-bot@users.noreply.github.com>"
          commit-message: "chore(go): weekly Go toolchain upgrade"
          title: "chore(go): weekly Go toolchain upgrade"
          body: |
            Automated weekly Go toolchain upgrade.

            - Updates the `toolchain` directive to the latest released Go version.
            - Runs `go mod tidy` to keep module files consistent.
          labels: |
            dependencies
            semver: patch
            docs: skip
          token: ${{ secrets.GH_TOKEN_OPEN_NEW_PR }}
