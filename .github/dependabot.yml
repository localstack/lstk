version: 2

# The 7-day cooldown skips freshly published (possibly compromised) releases;
# security updates are exempt.
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "semver: patch"
      - "docs: skip"
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/test/integration"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "semver: patch"
      - "docs: skip"
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "semver: patch"
      - "docs: skip"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Bumps the hook revs, including the zizmor version zizmor.yml runs in CI.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    labels:
      - "semver: patch"
      - "docs: skip"

  # Bumps pre-commit itself, which zizmor.yml installs from this file.
  - package-ecosystem: "pip"
    directory: "/.github/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    labels:
      - "semver: patch"
      - "docs: skip"
